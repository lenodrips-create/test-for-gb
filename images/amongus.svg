<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="visorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B2DCEF"/>
      <stop offset="1" stop-color="#577F9E"/>
    </linearGradient>
    <clipPath id="rounded"><rect width="100" height="100" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="100" height="100" fill="#FEDE29"/>
    <g stroke="#1A0A10" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round">
      <!-- backpack (behind body) -->
      <rect x="60" y="45" width="29" height="46" rx="13" fill="#C8121B"/>
      <!-- body -->
      <path d="M13,44 Q13,13 40.5,12 Q70,12 70,44 L70,104 L13,104 Z" fill="#C8121B"/>
    </g>
    <!-- maroon shading (no stroke, sits inside the red) -->
    <path d="M14.5,86 Q14.5,80 20,80 L63.5,80 Q68.8,80 68.8,86 L68.8,104 L14.5,104 Z" fill="#7A0A32"/>
    <rect x="75.5" y="49.5" width="12" height="37" rx="6" fill="#7A0A32"/>
    <!-- visor -->
    <rect x="20" y="39" width="43" height="28" rx="14" fill="#122A3A" stroke="#1A0A10" stroke-width="2.4"/>
    <rect x="24" y="42.6" width="35" height="20.8" rx="10.4" fill="url(#visorGrad)"/>
    <ellipse cx="33.5" cy="50" rx="9.2" ry="4.6" fill="#EAF6FB" transform="rotate(-20 33.5 50)"/>
  </g>
</svg>
